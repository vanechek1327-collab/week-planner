<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой планировщик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#101114;
  --panel:#17191f;
  --panel-2:#1f222a;
  --panel-3:#252934;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.14);
  --text:#f4f6f8;
  --muted:#8f96a3;
  --soft:#c4c9d1;
  --blue:#4da3ff;
  --green:#4bd18a;
  --amber:#f4bd50;
  --red:#ff6a5f;
  --violet:#a78bfa;
  --shadow:0 18px 45px rgba(0,0,0,.28);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:focus,input:focus{outline:none}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  max-width:480px;
  margin:0 auto;
  overflow-x:hidden;
}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pressPop{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,12px)}18%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes pulseDot{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.45)}}
.app{min-height:100vh;padding-bottom:86px;background:linear-gradient(180deg,#121318 0%,#101114 46%,#0d0e11 100%)}
.page{display:none;animation:pageIn .26s ease both}
.page.active{display:block}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px 16px 10px;
  background:rgba(16,17,20,.86);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px);
}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:12px;line-height:1.2;color:var(--muted);font-weight:600}
h1{font-size:25px;line-height:1.15;font-weight:750;letter-spacing:0}
.ghost-btn{
  height:34px;
  padding:0 12px;
  border-radius:999px;
  background:var(--panel-2);
  color:var(--soft);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:650;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.ghost-btn:active{transform:scale(.95);background:var(--panel-3)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-chip{
  min-width:0;
  height:62px;
  border-radius:16px;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
  position:relative;
}
.day-chip:active{transform:scale(.94)}
.day-chip.active{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.day-chip.today:not(.active){color:var(--blue)}
.day-name{font-size:11px;font-weight:700}
.day-num{font-size:18px;font-weight:760}
.day-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:0}
.day-chip.has-items .day-dot{opacity:1;animation:pulseDot 1.9s ease-in-out infinite}
.content{padding:14px 14px 0}
.overview{
  display:grid;
  grid-template-columns:76px minmax(0,1fr);
  gap:14px;
  align-items:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  box-shadow:var(--shadow);
}
.donut{
  --progress:0deg;
  width:76px;
  height:76px;
  border-radius:50%;
  background:conic-gradient(var(--green) var(--progress),var(--panel-3) 0);
  display:grid;
  place-items:center;
  position:relative;
}
.donut:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}
.donut span{position:relative;z-index:1;font-size:18px;font-weight:800}
.overview-title{font-size:17px;font-weight:760;margin-bottom:5px}
.overview-meta{font-size:13px;color:var(--muted);line-height:1.35}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px 8px;
}
.stat-value{font-size:20px;font-weight:800}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.filters{
  margin:14px 0 12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:4px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}
.filter-btn{
  min-width:0;
  height:36px;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  transition:transform .18s ease,background .18s ease,color .18s ease;
}
.filter-btn:active{transform:scale(.94)}
.filter-btn.active{background:var(--panel-3);color:var(--text)}
.list{display:flex;flex-direction:column;gap:9px}
.task-row{
  position:relative;
  display:grid;
  grid-template-columns:32px minmax(0,1fr) 34px;
  gap:10px;
  align-items:center;
  min-height:74px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:11px 10px 11px 12px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);
  animation:rowIn .28s ease both;
  transition:transform .18s ease,border-color .18s ease,background .18s ease,opacity .18s ease;
  overflow:hidden;
}
.task-row:active{transform:scale(.985)}
.task-row.done{opacity:.58}
.task-row:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 99px 99px 0;background:var(--blue)}
.task-row.work:before{background:var(--violet)}
.task-row.train:before{background:var(--green)}
.task-row.life:before{background:var(--amber)}
.check{
  width:28px;
  height:28px;
  border-radius:50%;
  background:transparent;
  border:1.6px solid var(--line-strong);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:15px;
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.check:active{animation:pressPop .22s ease}
.check.checked{background:var(--green);border-color:var(--green)}
.task-title{
  font-size:15px;
  line-height:1.28;
  font-weight:720;
  overflow-wrap:anywhere;
}
.task-row.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{
  min-height:22px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:3px 8px;
  background:var(--panel-2);
  color:var(--soft);
  font-size:11px;
  font-weight:700;
  border:1px solid var(--line);
}
.pill.work{color:#d9ccff}
.pill.train{color:#baf4d2}
.pill.life{color:#f6db9c}
.priority{width:8px;height:8px;border-radius:50%;display:inline-block}
.priority.high{background:var(--red)}
.priority.mid{background:var(--amber)}
.priority.low{background:var(--green)}
.icon-btn{
  width:32px;
  height:32px;
  border-radius:50%;
  background:transparent;
  color:var(--muted);
  font-size:20px;
  display:grid;
  place-items:center;
  transition:transform .18s ease,background .18s ease,color .18s ease;
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.06)}
.icon-btn.delete:active{color:var(--red);background:rgba(255,106,95,.12)}
.empty{
  border:1px dashed var(--line-strong);
  border-radius:22px;
  padding:38px 18px;
  text-align:center;
  color:var(--muted);
  background:rgba(255,255,255,.02);
  animation:fadeIn .25s ease both;
}
.empty-title{font-size:16px;color:var(--soft);font-weight:760;margin-bottom:4px}
.fab{
  position:fixed;
  right:18px;
  bottom:calc(82px + env(safe-area-inset-bottom));
  z-index:40;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--blue);
  color:#06111f;
  font-size:32px;
  font-weight:500;
  box-shadow:0 16px 34px rgba(77,163,255,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}
.fab:active{transform:scale(.92) rotate(45deg);box-shadow:0 9px 24px rgba(77,163,255,.26)}
.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:35;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  background:rgba(16,17,20,.88);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
}
.nav-btn{
  height:50px;
  border-radius:16px;
  color:var(--muted);
  background:transparent;
  font-size:12px;
  font-weight:750;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .18s ease,background .18s ease,color .18s ease;
}
.nav-btn:active{transform:scale(.96)}
.nav-btn.active{background:var(--panel-2);color:var(--text)}
.nav-icon{font-size:17px}
.vit-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  box-shadow:var(--shadow);
}
.vit-count{font-size:32px;font-weight:850;line-height:1}
.vit-caption{font-size:12px;color:var(--muted);margin-top:3px}
.vit-progress{
  height:8px;
  border-radius:99px;
  background:var(--panel-3);
  margin-top:12px;
  overflow:hidden;
}
.vit-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:99px;transition:width .35s ease}
.vit-row{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 58px 34px;
  gap:10px;
  align-items:center;
  min-height:74px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  animation:rowIn .28s ease both;
}
.vit-icon{
  width:42px;
  height:42px;
  border-radius:15px;
  background:var(--panel-2);
  display:grid;
  place-items:center;
  font-size:21px;
}
.vit-name{font-size:15px;font-weight:740;overflow-wrap:anywhere}
.vit-dose{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.vit-row.taken .vit-name{text-decoration:line-through;color:var(--muted)}
.switch{position:relative;width:52px;height:30px;display:block}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{position:absolute;inset:0;border-radius:999px;background:var(--panel-3);border:1px solid var(--line);transition:background .22s ease}
.switch-thumb{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.switch input:checked+.switch-track{background:var(--green)}
.switch input:checked~.switch-thumb{transform:translateX(22px)}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:90;
  align-items:flex-end;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(8px);
}
.overlay.open{display:flex;animation:fadeIn .18s ease both}
.sheet{
  width:100%;
  max-height:91vh;
  overflow-y:auto;
  background:#14161b;
  border-radius:26px 26px 0 0;
  border:1px solid var(--line);
  border-bottom:0;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -24px 58px rgba(0,0,0,.48);
  animation:sheetIn .28s cubic-bezier(.2,.9,.2,1) both;
}
.sheet-handle{width:42px;height:4px;border-radius:99px;background:var(--panel-3);margin:0 auto 18px}
.sheet-title{font-size:20px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:14px}
.label{display:block;font-size:12px;color:var(--muted);font-weight:750;margin-bottom:7px}
.input{
  width:100%;
  height:48px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  outline:none;
  padding:0 14px;
  font-size:15px;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.input:focus{border-color:rgba(77,163,255,.58);box-shadow:0 0 0 4px rgba(77,163,255,.12);background:var(--panel-2)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-row,.weekday-row,.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{
  height:38px;
  padding:0 12px;
  border-radius:13px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:750;
  transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease;
}
.choice:active{transform:scale(.94)}
.choice.active{background:var(--panel-3);color:var(--text);border-color:var(--line-strong)}
.weekday-row{display:none;margin-top:10px}
.weekday-row.open{display:flex;animation:fadeIn .18s ease both}
.weekday{width:42px;height:38px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:780;transition:transform .18s ease,background .18s ease,color .18s ease}
.weekday.active{background:var(--blue);color:#07111f;border-color:transparent}
.weekday:active{transform:scale(.92)}
.emoji-choice{width:42px;height:42px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:21px;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.emoji-choice.active{background:var(--panel-3);border-color:var(--blue);transform:translateY(-1px)}
.sheet-actions{display:grid;gap:10px;margin-top:18px}
.primary{
  height:50px;
  border-radius:17px;
  background:var(--blue);
  color:#07111f;
  font-size:15px;
  font-weight:850;
  box-shadow:0 14px 28px rgba(77,163,255,.24);
  transition:transform .18s ease,box-shadow .18s ease;
}
.primary:active{transform:scale(.97);box-shadow:0 8px 18px rgba(77,163,255,.18)}
.secondary{
  height:44px;
  border-radius:15px;
  background:transparent;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}
.toast{
  position:fixed;
  left:50%;
  bottom:calc(146px + env(safe-area-inset-bottom));
  z-index:120;
  transform:translateX(-50%);
  background:rgba(244,246,248,.94);
  color:#101114;
  border-radius:999px;
  padding:10px 14px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 12px 34px rgba(0,0,0,.28);
  opacity:0;
  pointer-events:none;
}
.toast.show{animation:toastIn 1.55s ease both}
.confetti-layer{position:fixed;inset:0;z-index:110;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;left:50%;top:42%;width:6px;height:10px;border-radius:3px;animation:confetti .8s ease-out forwards}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app">
  <section class="page active" id="page-planner">
    <header class="topbar">
      <div class="title-row">
        <div>
          <div class="eyebrow" id="plannerDate"></div>
          <h1>Планировщик</h1>
        </div>
        <button class="ghost-btn" onclick="jumpToday()">Сегодня</button>
      </div>
      <div class="week-strip" id="daysNav"></div>
    </header>

    <main class="content">
      <section class="overview">
        <div class="donut" id="progressDonut"><span id="progressText">0%</span></div>
        <div>
          <div class="overview-title" id="overviewTitle">Свободный день</div>
          <div class="overview-meta" id="overviewMeta">Нет задач</div>
        </div>
      </section>
      <div class="stat-row" id="statsRow"></div>
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all',this)">Все</button>
        <button class="filter-btn" onclick="setFilter('work',this)">Работа</button>
        <button class="filter-btn" onclick="setFilter('train',this)">Зал</button>
        <button class="filter-btn" onclick="setFilter('life',this)">Дела</button>
      </div>
      <div class="list" id="tasksList"></div>
    </main>
  </section>

  <section class="page" id="page-vitamins">
    <header class="topbar">
      <div class="title-row">
        <div>
          <div class="eyebrow" id="vitDate"></div>
          <h1>Витамины</h1>
        </div>
        <button class="ghost-btn" onclick="openVitSheet()">Добавить</button>
      </div>
    </header>
    <main class="content">
      <section class="vit-toolbar">
        <div>
          <div class="vit-count" id="vitCount">0/0</div>
          <div class="vit-caption" id="vitCaption">На сегодня</div>
          <div class="vit-progress"><span id="vitProgress"></span></div>
        </div>
      </section>
      <div class="list" id="vitList" style="margin-top:12px"></div>
    </main>
  </section>

  <button class="fab" id="mainFab" onclick="openSheet()" aria-label="Добавить">+</button>
  <div class="confetti-layer" id="confettiLayer"></div>
  <div class="toast" id="toast"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="tab-planner" onclick="switchTab('planner')"><span class="nav-icon">▦</span>Расписание</button>
    <button class="nav-btn" id="tab-vitamins" onclick="switchTab('vitamins')"><span class="nav-icon">●</span>Витамины</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Новая задача</div>
    <div class="field">
      <label class="label">Название</label>
      <input class="input" type="text" id="taskInput" placeholder="Например: тренировка грудь">
    </div>
    <div class="field">
      <label class="label">Тип</label>
      <div class="choice-row">
        <button type="button" class="choice active" data-repeat="once" onclick="setDraftRepeat('once',this)">Один раз</button>
        <button type="button" class="choice" data-repeat="weekly" onclick="setDraftRepeat('weekly',this)">Повтор</button>
      </div>
      <div class="weekday-row" id="repeatDays">
        <button type="button" class="weekday" data-day="1" onclick="toggleRepeatDay(this,1)">Пн</button>
        <button type="button" class="weekday" data-day="2" onclick="toggleRepeatDay(this,2)">Вт</button>
        <button type="button" class="weekday" data-day="3" onclick="toggleRepeatDay(this,3)">Ср</button>
        <button type="button" class="weekday" data-day="4" onclick="toggleRepeatDay(this,4)">Чт</button>
        <button type="button" class="weekday" data-day="5" onclick="toggleRepeatDay(this,5)">Пт</button>
        <button type="button" class="weekday" data-day="6" onclick="toggleRepeatDay(this,6)">Сб</button>
        <button type="button" class="weekday" data-day="0" onclick="toggleRepeatDay(this,0)">Вс</button>
      </div>
    </div>
    <div class="field-grid">
      <div class="field">
        <label class="label">Время</label>
        <input class="input" type="time" id="taskTime">
      </div>
      <div class="field">
        <label class="label">Приоритет</label>
        <div class="choice-row">
          <button type="button" class="choice" data-priority="high" onclick="setDraftPriority('high',this)">Выс.</button>
          <button type="button" class="choice active" data-priority="mid" onclick="setDraftPriority('mid',this)">Сред.</button>
          <button type="button" class="choice" data-priority="low" onclick="setDraftPriority('low',this)">Низ.</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="label">Категория</label>
      <div class="choice-row">
        <button type="button" class="choice active" data-cat="work" onclick="setDraftCat('work',this)">Работа</button>
        <button type="button" class="choice" data-cat="train" onclick="setDraftCat('train',this)">Зал</button>
        <button type="button" class="choice" data-cat="life" onclick="setDraftCat('life',this)">Дела</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="primary" onclick="addTask()">Добавить</button>
      <button class="secondary" onclick="closeSheet()">Отмена</button>
    </div>
  </div>
</div>

<div class="overlay" id="vitOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Новый витамин</div>
    <div class="field">
      <label class="label">Название</label>
      <input class="input" type="text" id="vitNameInput" placeholder="Например: витамин D3">
    </div>
    <div class="field">
      <label class="label">Дозировка</label>
      <input class="input" type="text" id="vitDoseInput" placeholder="2000 МЕ, утром">
    </div>
    <div class="field">
      <label class="label">Иконка</label>
      <div class="emoji-row" id="emojiPicker">
        <button type="button" class="emoji-choice active" onclick="selectEmoji(this,'💊')">💊</button>
        <button type="button" class="emoji-choice" onclick="selectEmoji(this,'🟡')">🟡</button>
        <button type="button" class="emoji-choice" onclick="selectEmoji(this,'🔴')">🔴</button>
        <button type="button" class="emoji-choice" onclick="selectEmoji(this,'🌿')">🌿</button>
        <button type="button" class="emoji-choice" onclick="selectEmoji(this,'⚡')">⚡</button>
        <button type="button" class="emoji-choice" onclick="selectEmoji(this,'🌞')">🌞</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="primary" onclick="addVitamin()">Добавить</button>
      <button class="secondary" onclick="closeVitSheet()">Отмена</button>
    </div>
  </div>
</div>

<script>
const DAYS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const today=new Date();
const todayIdx=today.getDay();
let selectedDay=todayIdx;
let filterCat='all';
let selectedEmoji='💊';
let currentTab='planner';
let selectedRepeatDays=[];
let draftRepeat='once';
let draftCat='work';
let draftPriority='mid';
let toastTimer=null;

function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function makeId(prefix){return prefix+Date.now()+Math.floor(Math.random()*10000)}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateForDay(day){
  const d=new Date(today);
  d.setDate(today.getDate()-todayIdx+day);
  return d;
}
function selectedDateKey(){return dateKey(dateForDay(selectedDay))}
function haptic(kind='light'){try{window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(kind)}catch(e){}}
function showToast(text){
  const toast=document.getElementById('toast');
  toast.textContent=text;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1550);
}
function showConfetti(){
  const layer=document.getElementById('confettiLayer');
  const colors=['#4da3ff','#4bd18a','#f4bd50','#ff6a5f','#a78bfa'];
  for(let i=0;i<18;i++){
    const piece=document.createElement('span');
    piece.className='confetti-piece';
    piece.style.background=colors[i%colors.length];
    piece.style.setProperty('--x',(Math.random()*220-110)+'px');
    piece.style.setProperty('--y',(Math.random()*180+70)+'px');
    piece.style.setProperty('--r',(Math.random()*520-260)+'deg');
    piece.style.animationDelay=(Math.random()*120)+'ms';
    layer.appendChild(piece);
    setTimeout(()=>piece.remove(),1000);
  }
}

let tasks=load('planner_tasks_by_date');
let recurringTasks=load('planner_recurring_tasks')||[];
let recurringDone=load('planner_recurring_done')||{};
if(!tasks){
  tasks={};
  const oldTasks=load('planner_tasks')||{};
  Object.keys(oldTasks).forEach(day=>{
    const key=dateKey(dateForDay(Number(day)));
    tasks[key]=(oldTasks[day]||[]).map(t=>({...t,id:t.id||makeId('t'),done:!!t.done}));
  });
  save('planner_tasks_by_date',tasks);
}
let vitamins=load('planner_vitamins')||[];
let vitTaken=load('planner_vitTaken')||{};

function formatDate(d){return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`}
function catLabel(cat){return cat==='work'?'Работа':cat==='train'?'Зал':'Дела'}
function priorityLabel(p){return p==='high'?'Высокий':p==='mid'?'Средний':'Низкий'}
function getTasksForDay(day){
  const key=dateKey(dateForDay(day));
  const oneTime=(tasks[key]||[]).map(t=>({...t,viewId:'t-'+t.id,recurring:false}));
  const repeated=recurringTasks
    .filter(t=>(t.days||[]).includes(day))
    .map(t=>({...t,viewId:'r-'+t.id,recurring:true,done:!!(recurringDone[key]&&recurringDone[key][t.id])}));
  return oneTime.concat(repeated);
}

function buildDays(){
  const nav=document.getElementById('daysNav');
  nav.innerHTML='';
  for(let i=0;i<7;i++){
    const d=dateForDay(i);
    const dayTasks=getTasksForDay(i);
    const btn=document.createElement('button');
    btn.className='day-chip'+(i===todayIdx?' today':'')+(i===selectedDay?' active':'')+(dayTasks.length?' has-items':'');
    btn.innerHTML=`<span class="day-name">${DAYS[i]}</span><span class="day-num">${d.getDate()}</span><span class="day-dot"></span>`;
    btn.onclick=()=>{selectedDay=i;haptic();buildDays();renderTasks()};
    nav.appendChild(btn);
  }
}

function renderTasks(){
  const list=document.getElementById('tasksList');
  const dayDate=dateForDay(selectedDay);
  const all=getTasksForDay(selectedDay);
  let visible=all.filter(t=>filterCat==='all'||t.cat===filterCat);
  visible=visible.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const done=all.filter(t=>t.done).length;
  const left=Math.max(all.length-done,0);
  const pct=all.length?Math.round(done/all.length*100):0;

  document.getElementById('plannerDate').textContent=formatDate(dayDate);
  document.getElementById('progressDonut').style.setProperty('--progress',pct*3.6+'deg');
  document.getElementById('progressText').textContent=pct+'%';
  document.getElementById('overviewTitle').textContent=all.length?(left?`${left} в работе`:'День закрыт'):'Свободный день';
  document.getElementById('overviewMeta').textContent=all.length?`${done} из ${all.length} выполнено`:'Можно оставить его пустым';
  document.getElementById('statsRow').innerHTML=`<div class="stat"><div class="stat-value">${all.length}</div><div class="stat-label">задач</div></div><div class="stat"><div class="stat-value">${done}</div><div class="stat-label">готово</div></div><div class="stat"><div class="stat-value">${pct}%</div><div class="stat-label">прогресс</div></div>`;

  if(!visible.length){
    list.innerHTML='<div class="empty"><div class="empty-title">Нет задач</div><div>Этот список пока чистый</div></div>';
    return;
  }
  list.innerHTML=visible.map((t,i)=>{
    const days=t.recurring?`<span class="pill">${(t.days||[]).map(d=>DAYS[d]).join(' ')}</span>`:'';
    const time=t.time?`<span class="pill">${escapeHtml(t.time)}</span>`:'';
    return `<div class="task-row ${t.cat} ${t.done?'done':''}" style="animation-delay:${i*0.035}s">
      <button class="check ${t.done?'checked':''}" onclick="toggleTask('${t.viewId}')" aria-label="Готово">${t.done?'✓':''}</button>
      <div>
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          ${time}
          <span class="pill ${t.cat}">${catLabel(t.cat)}</span>
          ${days}
          <span class="pill"><span class="priority ${t.priority}"></span>${priorityLabel(t.priority)}</span>
        </div>
      </div>
      <button class="icon-btn delete" onclick="deleteTask('${t.viewId}')" aria-label="Удалить">×</button>
    </div>`;
  }).join('');
}

function toggleTask(viewId){
  const key=selectedDateKey();
  const type=viewId.slice(0,1);
  const id=viewId.slice(2);
  let becameDone=false;
  if(type==='r'){
    if(!recurringDone[key])recurringDone[key]={};
    recurringDone[key][id]=!recurringDone[key][id];
    becameDone=!!recurringDone[key][id];
    save('planner_recurring_done',recurringDone);
  }else{
    const arr=tasks[key]||[];
    const t=arr.find(x=>String(x.id)===id);
    if(t){t.done=!t.done;becameDone=!!t.done;save('planner_tasks_by_date',tasks)}
  }
  haptic(becameDone?'medium':'light');
  renderTasks();
  buildDays();
  if(becameDone){showConfetti();showToast('Готово')}
}

function deleteTask(viewId){
  const key=selectedDateKey();
  const type=viewId.slice(0,1);
  const id=viewId.slice(2);
  if(type==='r'){
    recurringTasks=recurringTasks.filter(t=>String(t.id)!==id);
    Object.keys(recurringDone).forEach(k=>{if(recurringDone[k])delete recurringDone[k][id]});
    save('planner_recurring_tasks',recurringTasks);
    save('planner_recurring_done',recurringDone);
  }else{
    tasks[key]=(tasks[key]||[]).filter(t=>String(t.id)!==id);
    save('planner_tasks_by_date',tasks);
  }
  haptic();
  renderTasks();
  buildDays();
  showToast('Удалено');
}

function setFilter(cat,btn){
  filterCat=cat;
  document.querySelectorAll('.filter-btn').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  haptic();
  renderTasks();
}
function jumpToday(){selectedDay=todayIdx;haptic();buildDays();renderTasks()}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  const fab=document.getElementById('mainFab');
  if(tab==='vitamins'){fab.onclick=openVitSheet;renderVitamins()}else{fab.onclick=openSheet}
  haptic();
}

function openSheet(){
  draftRepeat='once';
  draftCat=filterCat==='all'?'work':filterCat;
  draftPriority='mid';
  selectedRepeatDays=[selectedDay];
  syncDraftControls();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('taskInput').focus(),250);
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('taskInput').value='';
  document.getElementById('taskTime').value='';
}
function setDraftRepeat(value,btn){draftRepeat=value;syncDraftControls();haptic()}
function setDraftCat(value,btn){draftCat=value;syncDraftControls();haptic()}
function setDraftPriority(value,btn){draftPriority=value;syncDraftControls();haptic()}
function syncDraftControls(){
  document.querySelectorAll('[data-repeat]').forEach(btn=>btn.classList.toggle('active',btn.dataset.repeat===draftRepeat));
  document.querySelectorAll('[data-cat]').forEach(btn=>btn.classList.toggle('active',btn.dataset.cat===draftCat));
  document.querySelectorAll('[data-priority]').forEach(btn=>btn.classList.toggle('active',btn.dataset.priority===draftPriority));
  document.getElementById('repeatDays').classList.toggle('open',draftRepeat==='weekly');
  document.querySelectorAll('.weekday').forEach(btn=>btn.classList.toggle('active',selectedRepeatDays.includes(Number(btn.dataset.day))));
}
function toggleRepeatDay(btn,day){
  selectedRepeatDays=selectedRepeatDays.includes(day)?selectedRepeatDays.filter(d=>d!==day):selectedRepeatDays.concat(day);
  syncDraftControls();
  haptic();
}
function addTask(){
  const title=document.getElementById('taskInput').value.trim();
  if(!title){showToast('Название пустое');return}
  const base={title,time:document.getElementById('taskTime').value,cat:draftCat,priority:draftPriority};
  if(draftRepeat==='weekly'){
    const days=selectedRepeatDays.length?selectedRepeatDays:[selectedDay];
    recurringTasks.push({...base,id:makeId('r'),days});
    save('planner_recurring_tasks',recurringTasks);
    showToast('Повтор добавлен');
  }else{
    const key=selectedDateKey();
    if(!tasks[key])tasks[key]=[];
    tasks[key].push({...base,id:makeId('t'),done:false});
    save('planner_tasks_by_date',tasks);
    showToast('Задача добавлена');
  }
  haptic('medium');
  closeSheet();
  renderTasks();
  buildDays();
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});

function todayKey(){return dateKey(new Date())}
function renderVitamins(){
  const key=todayKey();
  if(!vitTaken[key])vitTaken[key]={};
  const taken=Object.values(vitTaken[key]).filter(Boolean).length;
  const total=vitamins.length;
  const pct=total?Math.round(taken/total*100):0;
  document.getElementById('vitDate').textContent=formatDate(new Date());
  document.getElementById('vitCount').textContent=`${taken}/${total}`;
  document.getElementById('vitCaption').textContent=total?(taken===total?'Все закрыто':'На сегодня'):'Список пуст';
  document.getElementById('vitProgress').style.width=pct+'%';
  const list=document.getElementById('vitList');
  if(!vitamins.length){
    list.innerHTML='<div class="empty"><div class="empty-title">Нет витаминов</div><div>Список пока чистый</div></div>';
    return;
  }
  list.innerHTML=vitamins.map((v,i)=>{
    const isTaken=!!vitTaken[key][v.id];
    return `<div class="vit-row ${isTaken?'taken':''}" style="animation-delay:${i*0.035}s">
      <div class="vit-icon">${escapeHtml(v.emoji)}</div>
      <div>
        <div class="vit-name">${escapeHtml(v.name)}</div>
        <div class="vit-dose">${escapeHtml(v.dose||'')}</div>
      </div>
      <label class="switch">
        <input type="checkbox" ${isTaken?'checked':''} onchange="toggleVit('${v.id}',this.checked)">
        <span class="switch-track"></span>
        <span class="switch-thumb"></span>
      </label>
      <button class="icon-btn delete" onclick="deleteVit('${v.id}')" aria-label="Удалить">×</button>
    </div>`;
  }).join('');
}
function toggleVit(id,checked){
  const key=todayKey();
  if(!vitTaken[key])vitTaken[key]={};
  vitTaken[key][id]=checked;
  save('planner_vitTaken',vitTaken);
  haptic(checked?'medium':'light');
  if(checked){showConfetti();showToast('Принято')}
  setTimeout(()=>renderVitamins(),180);
}
function deleteVit(id){
  vitamins=vitamins.filter(v=>v.id!==id);
  save('planner_vitamins',vitamins);
  renderVitamins();
  haptic();
  showToast('Удалено');
}
function openVitSheet(){
  selectedEmoji='💊';
  document.querySelectorAll('.emoji-choice').forEach((btn,i)=>btn.classList.toggle('active',i===0));
  document.getElementById('vitOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('vitNameInput').focus(),250);
}
function closeVitSheet(){
  document.getElementById('vitOverlay').classList.remove('open');
  document.getElementById('vitNameInput').value='';
  document.getElementById('vitDoseInput').value='';
}
function selectEmoji(el,emoji){
  selectedEmoji=emoji;
  document.querySelectorAll('.emoji-choice').forEach(btn=>btn.classList.remove('active'));
  el.classList.add('active');
  haptic();
}
function addVitamin(){
  const name=document.getElementById('vitNameInput').value.trim();
  if(!name){showToast('Название пустое');return}
  vitamins.push({id:'v'+Date.now(),name,dose:document.getElementById('vitDoseInput').value.trim(),emoji:selectedEmoji});
  save('planner_vitamins',vitamins);
  closeVitSheet();
  renderVitamins();
  haptic('medium');
  showToast('Витамин добавлен');
}
document.getElementById('vitOverlay').addEventListener('click',e=>{if(e.target.id==='vitOverlay')closeVitSheet()});

if(window.Telegram&&window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
buildDays();
renderTasks();
</script>
</body>
</html>
